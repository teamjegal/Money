<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>동의 클리너</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #1b2430; background: #fff; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e3e8ef; }
    .logo { width: 26px; height: 26px; border-radius: 7px; background: #2156d9; color: #fff; display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 15px; margin: 0; }
    main { padding: 14px; }
    .site { font-size: 12px; color: #637083; margin-bottom: 10px; word-break: break-all; }
    .guide { background: #eaf0fd; color: #1a3d99; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: #2156d9; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 1em; }
    .msg.warn { color: #a13030; } .msg.ok { color: #17663a; }
    .note { margin-top: 12px; font-size: 11px; color: #8a94a3; }
  </style>
</head>
<body>
  <header><span class="logo">✓</span><h1>동의 클리너</h1></header>
  <main>
    <div class="site" id="site"></div>
    <div class="guide" id="guide" hidden></div>
    <button id="scan">이 페이지에서 광고 동의 찾기</button>
    <div class="msg" id="msg" role="status"></div>
    <p class="note">찾은 항목은 노란색으로 표시만 해요. 페이지의 배너에서 [승인]을 눌러야 끄고 저장합니다. 탈퇴·결제·로그아웃은 누르지 않아요.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
