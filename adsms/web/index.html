<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADyson 리포트</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5f1ea; --ink:#141414; --red:#e63312 }
  * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,"Malgun Gothic",sans-serif; padding:40px 16px }
  .wrap { max-width:1080px; margin:auto }
  .mast { display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--ink); padding-bottom:10px; font-size:12px; text-transform:uppercase; letter-spacing:.12em }
  .st[data-state=ok]{ color:#0a7d3b } .st[data-state=err]{ color:var(--red) }
  h1 { font-family:"Instrument Serif",serif; font-weight:400; font-size:clamp(48px,9vw,120px); line-height:.95; margin:28px 0 8px; letter-spacing:-.02em }
  h1 em { color:var(--red) } .dek { font-size:18px; max-width:620px; line-height:1.5; margin-bottom:36px }
  .cols { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--ink) }
  .cols > div { padding:16px 16px 20px 0; border-right:1px solid var(--ink) } .cols > div:not(:first-child){ padding-left:16px } .cols > div:last-child { border:0 }
  .k { font-size:11px; text-transform:uppercase; letter-spacing:.12em } .v { font-family:"Instrument Serif",serif; font-size:64px; line-height:1; margin-top:8px }
  .sect { display:grid; grid-template-columns:1fr 2fr; gap:40px; border-top:2px solid var(--ink); margin-top:36px; padding-top:18px }
  .sect h2 { font-family:"Instrument Serif",serif; font-weight:400; font-size:34px; margin:0 } .sect p { line-height:1.6 }
  [data-hourly] { display:flex; align-items:flex-end; gap:2px; height:160px; border-bottom:1px solid var(--ink) } [data-hourly] i { flex:1; height:calc(var(--h,0)*100%); min-height:1px; background:var(--ink) }
  .axis { display:flex; justify-content:space-between; font-size:11px; margin-top:6px }
  .split { height:22px; display:flex; margin-top:10px; background:linear-gradient(90deg,var(--red) calc(var(--p,0)*1%), var(--ink) 0) }
  @media (max-width:820px){ .cols{ grid-template-columns:repeat(2,1fr) } .cols > div, .cols > div:not(:first-child){ padding:14px 12px 16px; border-bottom:1px solid var(--ink) } .cols > div:nth-child(2n){ border-right:0 } .cols > div:nth-child(2n+1){ border-right:1px solid var(--ink); padding-left:0 } .sect{ grid-template-columns:1fr; gap:16px } .v{ font-size:48px } }
</style>
</head>
<body><div class="wrap">
  <div class="mast"><span>ADyson Report · Vol. 01</span><span class="st" data-status>…</span><span>갱신 <span data-k="updatedText"></span> KST</span></div>
  <h1><span data-k="total">–</span>건의 광고에<br><em>“그만”</em>이라고 말했다.</h1>
  <p class="dek">사용자 <b data-k="users" data-unit="명">–</b>이 앱에서 수신거부를 마쳤다. 1인당 평균 <b data-k="avgPerUser" data-unit="건">–</b>. 문자 내용과 번호는 폰 밖으로 나가지 않았다.</p>
  <div class="cols">
    <div><div class="k">080 전화</div><div class="v" data-k="method080">–</div></div>
    <div><div class="k">거부 링크</div><div class="v" data-k="methodLink">–</div></div>
    <div><div class="k">오늘</div><div class="v" data-k="today">–</div></div>
    <div><div class="k">마지막 기록</div><div class="v" data-k="lastAtText">–</div></div>
  </div>
  <div class="sect"><div><h2>언제 거부하나</h2><p>KST 기준 시간대별 누적. 가장 많은 시간은 <b data-k="peakHourText">–</b>.</p></div><div><div data-hourly></div><div class="axis"><span>0시</span><span>6시</span><span>12시</span><span>18시</span><span>23시</span></div></div></div>
  <div class="sect"><div><h2>어떻게 거부하나</h2><p>빨강 080 전화 <b data-k="share080" data-unit="%"></b>, 검정 거부 링크 <b data-k="shareLink" data-unit="%"></b>.</p></div><div><div class="split" data-donut></div></div></div>
  <p class="k" style="margin-top:40px">서버에는 익명 설치 ID · 거부 방법(080/링크) · 시각만 저장됩니다 · 30초마다 자동 갱신</p>
</div><script>
/*
 * ADyson 대시보드 공통 데이터 스크립트
 * - stats API(집계값만)를 30초마다 불러와 화면에 채운다.
 * - 각 HTML은 아래 속성만 달면 된다:
 *   data-k="total"        숫자/텍스트 (data-unit="건" 으로 단위)
 *   data-hourly           0~23시 막대그래프 (<i> 24개를 만들어 --h 높이 비율을 넣음)
 *   data-donut            080 비율을 --p(0~100)로 넣음 → CSS conic-gradient로 그림
 *   data-status           LIVE / OFFLINE 표시 (data-state="ok|err")
 * 사용 가능한 키: total users avgPerUser method080 methodLink today lastHour
 *               share080 shareLink lastAtText peakHourText updatedText
 */
(function () {
  const STATS_URL = "https://prqezaecwmfvjhfmqytf.supabase.co/functions/v1/stats";
  const nf = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 1 });
  const hm = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false });
  const hms = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });

  function derive(s) {
    s.share080 = s.total ? Math.round((s.method080 / s.total) * 100) : 0;
    s.shareLink = s.total ? 100 - s.share080 : 0;
    s.lastAtText = s.lastAt ? hm.format(new Date(s.lastAt)) : "–";
    const max = Math.max(0, ...(s.hourly || []));
    s.peakHourText = max ? String(s.hourly.indexOf(max)).padStart(2, "0") + "시" : "–";
    s.updatedText = hms.format(new Date(s.updatedAt || Date.now()));
    return s;
  }

  function render(s) {
    document.querySelectorAll("[data-k]").forEach((el) => {
      const v = s[el.dataset.k];
      el.textContent = typeof v === "number" ? nf.format(v) + (el.dataset.unit || "") : v ?? "–";
    });
    document.querySelectorAll("[data-hourly]").forEach((el) => {
      const max = Math.max(1, ...s.hourly);
      el.innerHTML = s.hourly
        .map((n, h) => `<i style="--h:${(n / max).toFixed(3)}" title="${h}시 · ${n}건"></i>`)
        .join("");
    });
    document.querySelectorAll("[data-donut]").forEach((el) => el.style.setProperty("--p", s.share080));
    document.querySelectorAll("[data-status]").forEach((el) => {
      el.textContent = "LIVE";
      el.dataset.state = "ok";
    });
  }

  async function load() {
    try {
      const res = await fetch(STATS_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      render(derive(await res.json()));
    } catch (e) {
      document.querySelectorAll("[data-status]").forEach((el) => {
        el.textContent = "OFFLINE";
        el.dataset.state = "err";
      });
    }
  }

  // 첫 렌더 전에도 막대 자리를 잡아 둔다
  document.querySelectorAll("[data-hourly]").forEach((el) => {
    el.innerHTML = "<i></i>".repeat(24);
  });
  load();
  setInterval(load, 30000);
})();
</script></body></html>
