# main에 푸시하면 https://teamjegal.github.io/Money/ 로 배포된다.
# ADyson 통계 페이지는 https://teamjegal.github.io/Money/adsms/ 에 함께 올라간다.
# 최초 1회: GitHub 레포 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Money/
      # ADyson 통계 페이지 → https://teamjegal.github.io/Money/adsms/
      # (정적 HTML 하나만 복사. APK는 배포하지 않는다)
      - name: Add ADyson stats page
        run: |
          mkdir -p dist/adsms
          cp adsms/web/index.html dist/adsms/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
